name: Deploy to Caddy

# Self-hosted on aiproxy-saas: GitHub-hosted runners cannot SSH (SG allowlist).
# Runner systemd unit restarts when EventBridge starts the instance each morning.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, aiproxy-saas]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Rsync to /var/www/agentu
        env:
          DEPLOY_LOCAL: "1"
        run: bash scripts/deploy-saas.sh
