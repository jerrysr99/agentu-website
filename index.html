   ['status','Status','status','']]},
 boards:{pk:'slug',title:'Board',fields:[
   ['slug','Slug','text',''],['name','Name','text',''],
   ['board_type','Type','board_type','bench = design review · testboard = adversarial ship verdict · advisory = strategy/GTM'],
   ['scope','Scope','board_scope',''],['charter','Charter','textarea',''],
   ['minutes_register','Minutes register','text',''],['status','Status','status','']]}
};

async function loadOrg(repaint){
  const [ov,un]=await Promise.all([api('/org/overview'),api('/org/unattributed')]);
  if(!ov.ok){ORG.err=(ov.data&&ov.data.error)||('HTTP '+ov.status);ORG.loaded=true;
    if(repaint&&location.hash==='#/app/org')document.getElementById('root').innerHTML=pageOrg();return}
  ORG.err='';
  ['departments','participants','teams','projects','boards','seats','team_members','project_members']
    .forEach(k=>{ORG[k]=ov.data[k]||[]});
  if(un.ok){ORG.unattributed=un.data.rows||[];ORG.coverage=un.data.coverage||[];ORG.ledger_total=un.data.ledger_total||null}
  ORG.loaded=true;
  if(repaint&&location.hash==='#/app/org')document.getElementById('root').innerHTML=pageOrg();
}

const _ousd=v=>(v==null?'—':'$'+Number(v).toFixed(4));
const _on=v=>(v==null||v===''?'—':esc(String(v)));
const _oago=t=>{if(!t)return '—';const d=(Date.now()-new Date(t).getTime())/1000;
  return d<90?Math.round(d)+'s ago':d<5400?Math.round(d/60)+'m ago':d<172800?Math.round(d/3600)+'h ago':Math.round(d/86400)+'d ago'};
const _okind=k=>k==='human'?'<span class="badge ok">human</span>':'<span class="badge dim">agent</span>';
const _ostat=s=>s==='active'?'<span class="badge ok">active</span>':s==='paused'?'<span class="badge warn">paused</span>':'<span class="badge dim">'+esc(s||'')+'</span>';

function orgTab(t){S.orgTab=t;document.getElementById('root').innerHTML=pageOrg();window.scrollTo(0,0)}

function pageOrg(){
  const tab=S.orgTab||'departments';
  const nav=`<div class="card" style="margin-bottom:14px"><div class="cbody" style="display:flex;gap:8px;flex-wrap:wrap">
    ${ORG_TABS.map(t=>`<button class="btn sm ${tab===t[0]?'':'ghost'}" onclick="orgTab('${t[0]}')">${t[1]}</button>`).join('')}
   </div></div>`;
  let body;
  if(!ORG.loaded)body=`<div class="card"><div class="cbody muted">Loading the organization…</div></div>`;
  else if(ORG.err)body=`<div class="card"><div class="cbody"><strong>Could not load the organization.</strong>
    <div class="muted" style="margin-top:6px">${esc(ORG.err)}</div></div></div>`;
  else body=({departments:orgDepartments,participants:orgPlayers,teams:orgTeams,
              boards:orgBoards,projects:orgProjects,unattributed:orgUnattributed}[tab]||orgDepartments)();
  const canDefine=tab!=='unattributed';
  return appShell('Organization',
    'Players, teams, seats, boards and projects — the control plane. A definition here sets the object <em>and</em> its governance: its key, its department, its cap, and the human responsible for it.',
    nav+body,
    canDefine?`<button class="btn" onclick="orgNew('${tab}')">Define ${(ORG_FORMS[tab]||{}).title||''}</button>`:'');
}

function _otbl(head,rows,empty){
  return `<div class="card"><div class="tblwrap"><table class="tbl"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
   <tbody>${rows||`<tr><td colspan="${head.length}" class="muted" style="padding:16px">${empty||'Nothing defined yet.'}</td></tr>`}</tbody></table></div></div>`;
}
function _oact(kind,ref){
  return `<button class="btn sm ghost" onclick="orgEdit('${kind}','${ref}')">Edit</button>
   <button class="btn sm ghost" onclick="orgRetire('${kind}','${ref}')" title="Retire — definitions are never destroyed">Retire</button>`;
}

function orgDepartments(){
  const rows=ORG.departments.map(d=>`<tr>
    <td><strong>${esc(d.name||d.slug)}</strong><br><span class="mono faint" style="font-size:11.5px">${esc(d.slug)}</span></td>
    <td style="font-size:12px">${_on(d.description)}</td>
    <td>${_on(d.responsible_name)}</td>
    <td class="mono">${d.budget_usd!=null?_ousd(d.budget_usd):'—'}${d.cap_usd!=null?' <span class="faint">cap '+_ousd(d.cap_usd)+'</span>':''}</td>
    <td class="mono">${_ousd(d.spend_usd)}</td>
    <td class="mono" style="font-size:12px">${d.requests||0}</td>
    <td style="font-size:12px">${_oago(d.last_activity)}</td>
    <td>${_ostat(d.status)}</td><td>${_oact('departments',d.slug)}</td></tr>`).join('');
  return `<p class="muted" style="font-size:12.5px;margin:0 0 10px">Department is <strong>key-bound</strong>: it is stamped on every TDR from the key itself, so no caller can misattribute it. Spend below is the live ledger total for that slug.</p>`+
   _otbl(['Department','Description','Responsible human','Budget','Spend (ledger)','Requests','Last activity','Status',''],rows);
}

  const rows=ORG.participants.map(p=>`<tr>
    <td><strong>${esc(p.name||p.slug)}</strong><br><span class="mono faint" style="font-size:11.5px">${esc(p.slug)}</span></td>
    <td>${_okind(p.kind)}</td>
    <td style="font-size:12px">${_on(p.role)}</td>

    <td class="mono" style="font-size:11.5px">${p.key_id?esc(p.key_id):'<span class="badge warn">no bound key</span>'}</td>
    <td style="font-size:11.5px">${p.may_authorize_spend?'<span class="badge new">authorize</span> ':''}${p.may_engage_agents?'<span class="badge new">engage</span>':''}${(!p.may_authorize_spend&&!p.may_engage_agents)?'<span class="faint">—</span>':''}</td>

     <td class="mono" style="font-size:12px">${p.requests||0}</td>
     <td>${_ostat(p.status)}</td><td>${_oact('projects',p.slug)}</td></tr>`}).join('');
  return `<p class="muted" style="font-size:12.5px;margin:0 0 10px">Project is <strong>caller-asserted</strong> — it arrives on the <span class="mono">X-Proxy-Project</span> header, so a project slug here must match what the callers send. Spend is the live ledger total for that slug.</p>`+
   _otbl(['Project','Objective','Department','Gates','Members','Spend (ledger)','Requests','Status',''],rows);
}

function orgUnattributed(){
  const cov=ORG.coverage||[];
  const lt=ORG.ledger_total||{};
  const tot=Number(lt.total||0);
  const get=b=>cov.find(c=>c.bucket===b)||{spend_usd:0,requests:0};
  const pc=v=>tot?(100*Number(v||0)/tot):0;
  const unowned=get('unowned'), complete=get('complete');
  const COLOR={unowned:'var(--bad)',dept_no_user:'#B7791F',user_no_dept:'#B7791F',
               no_project:'#3B82C4',complete:'var(--good)'};
  const order=['unowned','dept_no_user','user_no_dept','no_project','complete'];
  const covrows=order.map(b=>cov.find(c=>c.bucket===b)).filter(Boolean).map(c=>`<tr>
    <td><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${COLOR[c.bucket]||'#888'};margin-right:7px"></span>
        <strong>${esc(c.label)}</strong><br><span class="mono faint" style="font-size:11.5px">${esc(c.bucket)}</span></td>
    <td class="mono">${_ousd(c.spend_usd)}</td>
    <td class="mono" style="font-size:12px">${pc(c.spend_usd).toFixed(1)}%</td>
    <td class="mono" style="font-size:12px">${Number(c.requests||0).toLocaleString()}</td></tr>`).join('');
  const bar=order.map(b=>{const c=cov.find(x=>x.bucket===b);if(!c)return '';
    const w=pc(c.spend_usd);if(w<=0)return '';
    return `<div title="${esc(c.label)} — ${_ousd(c.spend_usd)}" style="width:${w}%;background:${COLOR[b]||'#888'}"></div>`}).join('');

  const rows=ORG.unattributed.map(u=>`<tr>
    <td class="mono" style="font-size:12px">${esc(u.key_id||'(no key)')}</td>
    <td>${u.missing_user?'<span class="badge warn">no user</span> ':''}${u.missing_department?'<span class="badge warn">no dept</span> ':''}${u.missing_project?'<span class="badge dim">no project</span>':''}</td>
    <td class="mono">${_ousd(u.spend_usd)}</td>
    <td class="mono" style="font-size:12px">${Number(u.requests||0).toLocaleString()}</td>
    <td style="font-size:12px">${_oago(u.last_activity)}</td></tr>`).join('');

  return `<div class="card" style="margin-bottom:14px"><div class="cbody">
    <div class="kicker">Attribution coverage — the hole the org model exists to close</div>
    <div class="kv" style="margin-top:8px">
     <div class="cell"><div class="k">Unowned spend</div><div class="v">${_ousd(unowned.spend_usd)}</div>
       <div class="faint" style="font-size:11px">${pc(unowned.spend_usd).toFixed(1)}% — no user and no department</div></div>
     <div class="cell"><div class="k">Fully attributed</div><div class="v">${_ousd(complete.spend_usd)}</div>
       <div class="faint" style="font-size:11px">${pc(complete.spend_usd).toFixed(1)}% — user, department and project</div></div>
     <div class="cell"><div class="k">Ledger total</div><div class="v">${_ousd(lt.total)}</div></div>
     <div class="cell"><div class="k">Ledger requests</div><div class="v">${Number(lt.n||0).toLocaleString()}</div></div>
    </div>
    <div style="display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:14px;background:#E7E9F5">${bar}</div>
    <p class="muted" style="font-size:12.5px;margin-top:12px">These five buckets are a true partition — they sum to the ledger total, so nothing is double-counted. Only <strong>unowned</strong> spend traces to no responsible human; the rest is owned but incompletely categorised. Binding a key to a user and a department closes the unowned bucket by construction, with no caller cooperation required.</p>
   </div></div>`+
   _otbl(['Bucket','Spend','Share','Requests'],covrows,'No ledger activity yet.')+
   `<p class="muted" style="font-size:12.5px;margin:14px 0 10px">By key. A key appears here if <em>any</em> of its requests is missing <em>any</em> dimension, so these rows overlap the buckets above and must not be summed against them.</p>`+
   _otbl(['Key','Missing','Spend','Requests','Last activity'],rows,'Nothing incomplete — every request carries user, department and project.');
}

/* ---------- definition forms (defining the object = defining its governance) ---------- */
function _ofield(f,val){
  const [name,label,type,help]=f;
  const h=help?`<div class="faint" style="font-size:11px;margin-top:3px">${help}</div>`:'';
  const v=val==null?'':String(val);
  let input;
  if(type==='textarea')input=`<textarea id="of-${name}" rows="3" style="width:100%">${esc(v)}</textarea>`;
  else if(type==='bool')input=`<select id="of-${name}" style="width:100%"><option value="false"${v!=='true'?' selected':''}>no</option><option value="true"${v==='true'?' selected':''}>yes</option></select>`;
  else if(type==='kind')input=`<select id="of-${name}" style="width:100%">${['human','agent'].map(k=>`<option${v===k?' selected':''}>${k}</option>`).join('')}</select>`;
  else if(type==='status')input=`<select id="of-${name}" style="width:100%">${['active','paused','retired'].map(k=>`<option${v===k?' selected':''}>${k}</option>`).join('')}</select>`;
  else if(type==='board_type')input=`<select id="of-${name}" style="width:100%">${['bench','testboard','advisory'].map(k=>`<option${v===k?' selected':''}>${k}</option>`).join('')}</select>`;
  else if(type==='board_scope')input=`<select id="of-${name}" style="width:100%">${['org','team','project'].map(k=>`<option${v===k?' selected':''}>${k}</option>`).join('')}</select>`;
  else if(type==='department')input=`<select id="of-${name}" style="width:100%"><option value=""></option>${ORG.departments.map(d=>`<option value="${esc(d.slug)}"${v===d.slug?' selected':''}>${esc(d.name)} (${esc(d.slug)})</option>`).join('')}</select>`;
  else if(type==='participant'||type==='participant-human'){
    const list=ORG.participants.filter(p=>type==='participant'||p.kind==='human');
    input=`<select id="of-${name}" style="width:100%"><option value=""></option>${list.map(p=>`<option value="${esc(p.id)}"${v===p.id?' selected':''}>${esc(p.name)} (${esc(p.slug)})</option>`).join('')}</select>`;
  }
  else input=`<input id="of-${name}" type="${type==='number'?'number':'text'}" step="any" value="${esc(v)}" style="width:100%">`;
  return `<div style="margin-bottom:12px"><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">${label}</label>${input}${h}</div>`;
}

function orgNew(kind){_orgForm(kind,null)}
function orgEdit(kind,ref){_orgForm(kind,ref)}

function _orgForm(kind,ref){
  const spec=ORG_FORMS[kind];if(!spec)return;
  const cur=ref?(ORG[kind]||[]).find(x=>x[spec.pk]===ref):null;
  const val=f=>{if(!cur)return '';const v=cur[f[0]];
    if(f[2]==='bool')return v?'true':'false';
    if(f[0]==='gates')return typeof v==='string'?v:JSON.stringify(v||{},null,1);
    return v==null?'':v};
  openDrawer(`<h2 style="margin:0 0 4px">${ref?'Edit':'Define'} ${spec.title}</h2>
   <p class="muted" style="font-size:12.5px;margin:0 0 16px">Defining ${ref?'this':'a'} ${spec.title.toLowerCase()} sets its governance — its attribution, its budget, and the human responsible for it.</p>
   <div id="org-form-err" class="muted" style="color:#C43D3D;font-size:12.5px;margin-bottom:8px"></div>
   ${spec.fields.map(f=>_ofield(f,val(f))).join('')}
   <div style="display:flex;gap:8px;margin-top:16px">
    <button class="btn" onclick="orgSave('${kind}',${ref?`'${ref}'`:'null'})">${ref?'Save':'Create'}</button>
    <button class="btn ghost" onclick="closeDrawer()">Cancel</button></div>`);
}

async function orgSave(kind,ref){
  const spec=ORG_FORMS[kind];const body={};
  spec.fields.forEach(f=>{
    const el=document.getElementById('of-'+f[0]);if(!el)return;
    let v=el.value;
    if(f[2]==='bool')v=(v==='true');
    else if(f[2]==='number')v=(v===''?'':Number(v));
    else if(f[0]==='gates'){try{v=v?JSON.parse(v):{}}catch(_){v={}}}
    body[f[0]]=v;
  });
  const r=ref?await api('/org/'+kind+'/'+encodeURIComponent(ref),{method:'PATCH',body})
             :await api('/org/'+kind,{method:'POST',body});
  if(!r.ok){const e=document.getElementById('org-form-err');
    if(e)e.textContent=(r.data&&r.data.error)||('Request failed — HTTP '+r.status);return}
  closeDrawer();toast(spec.title+(ref?' updated':' defined'));
  await loadOrg(true);
}

async function orgRetire(kind,ref){
  const r=await api('/org/'+kind+'/'+encodeURIComponent(ref),{method:'DELETE'});
  if(!r.ok){toast((r.data&&r.data.error)||'Could not retire');return}
  toast('Retired — the definition is kept, never destroyed');
  await loadOrg(true);
}

const ROUTES={
 '#/':pageMarketing,'#/signup':pageSignup,'#/verify':pageVerify,'#/details':pageDetails,'#/pending':pagePending,'#/create-org':pageCreateOrg,'#/plan':pagePlan,
 '#/login':pageLogin,'#/mfa':pageMfa,'#/enroll':pageEnroll,'#/request-access':pageRequestAccess,
 '#/forgot':pageForgot,'#/invite':pageInvite,'#/onboarding':pageOnboarding,
 '#/app':pageDash,'#/app/providers':pageProviders,'#/app/routing':pageRouting,'#/app/ratecards':pageRateCards,'#/app/clients':pageClients,
 '#/app/advisory':pageAdvisory,'#/app/requests':pageRequests,'#/app/reconciliation':pageRecon,'#/app/usage':pageUsage,
 '#/app/analytics':pageAnalytics,'#/app/limits':pageLimits,'#/app/keys':pageKeys,'#/app/team':pageTeam,
 '#/app/org':pageOrg,'#/app/billing':pageBilling,'#/app/audit':pageAudit,'#/app/settings':pageSettings};
function render(){
  const r=location.hash||'#/';
  /* Controls that only report success without doing anything exist ONLY in the
     demo. A live console must not offer an action it cannot perform: "Rotate"
     told a real user their key was rotated and the old one valid 24h, which is
     a false statement about a security operation. Hidden rather than disabled --
     a row of dead buttons is its own kind of lie about what the product does. */
  document.body.classList.toggle('demomode', !!S.demo);
  // In-page section anchors (e.g. #why, #analytics) scroll, they do not route.
  if(r.length>1&&!r.startsWith('#/')){
    const el=document.getElementById(r.slice(1));
    if(el){el.scrollIntoView({behavior:'smooth',block:'start'});return;}
  }
  closeDrawer();
  // Console routes require a live session (or demo mode). No session -> check the
  // first-party cookie once, then land in the console or bounce to login.
  if(r.startsWith('#/app')&&!S.demo&&!S.authed){
    if(!S._checking){
      S._checking=true;
      document.getElementById('root').innerHTML=authShell('<h1>Loading…</h1><div class="asub">Checking your session.</div>');
      ensureSession().then(ok=>{S._checking=false;ok?render():go('#/login')});
    }
    return;
  }
  const fn=ROUTES[r]||pageMarketing;
  document.getElementById('root').innerHTML=fn();
  window.scrollTo(0,0);
  if(r==='#/'||r==='')startTicker();else if(window._tick)clearInterval(window._tick);
  afterRender(r);
}
function afterRender(r){
  if(r==='#/enroll'){loadEnroll();return}
  if(r.startsWith('#/app')){
    if(S.authed&&!S.demo)hydrateLive(r);
    if(S.demo&&S.tour)renderTourStep();
  }
}
window.addEventListener('hashchange',render);
render();
