<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent U — The system of record for enterprise LLM consumption</title>
<meta name="description" content="Agent U rates every token at the tariff in force, routes to the best model for the job, reconciles every invoice, and enforces policy beyond the reach of apps and users.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12193F; --navy2:#1B2350; --navy3:#28336B;
  --indigo:#243469; --indigo-d:#1A2650; --indigo-soft:#ECEEF6; --indigo-line:#C4CBE0;
  --gold:#C6A241; --gold-d:#A9852B; --gold-ink:#8A6410; --gold-soft:#F4EBCF; --gold-line:#E4D3A0;
  --paper:#F7F3E8; --white:#FFFFFF; --ink:#1C2135; --slate:#5C6480; --faint:#8A91AC;
  --line:#E7E0CF; --good:#178A50; --good-soft:#E7F4EC; --warn:#B7791F; --warn-soft:#FCF3E3;
  --bad:#C43D3D; --bad-soft:#FBEBEB; --ice:#D7DEF2;
  --ui:'Inter',system-ui,-apple-system,sans-serif; --disp:'Newsreader',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sh:0 1px 2px rgba(23,29,63,.05),0 4px 14px rgba(23,29,63,.06);
  --sh-lg:0 8px 32px rgba(23,29,63,.14);
  --r:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{font-family:var(--ui);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--indigo);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:var(--ui);cursor:pointer}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink)}
.kicker::before{content:"";display:inline-block;width:16px;height:1.5px;background:var(--gold);vertical-align:middle;margin-right:8px;margin-bottom:2px}
.muted{color:var(--slate)}.faint{color:var(--faint)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;background:var(--indigo);color:#fff;transition:background .15s}
.btn:hover{background:var(--indigo-d);text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--indigo-soft);border-color:var(--indigo-line)}
.btn.on-dark{background:#fff;color:var(--navy)}
.btn.on-dark:hover{background:var(--ice)}
.btn.ghost-dark{background:transparent;color:#fff;border-color:rgba(255,255,255,.28)}
.btn.ghost-dark:hover{background:rgba(255,255,255,.08)}
.btn.danger{background:var(--bad)}
.btn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold-d)}
.btn.gold:hover{background:var(--gold-d);color:var(--navy)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
.btn.big{padding:13px 24px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Forms */
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.field .hint{font-size:12px;color:var(--faint);margin-top:5px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;font-family:var(--ui);background:#fff;color:var(--ink)}
.input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(91,91,214,.14)}
textarea.input{resize:vertical;min-height:74px;font-family:var(--mono);font-size:12.5px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--slate)}
.meter{height:5px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--bad);transition:width .2s,background .2s}

/* Badges & tags */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:3px 7px;background:var(--indigo-soft);color:var(--indigo)}
.badge.frontier{background:#FFF4D6;color:#8A6410}
.badge.strong{background:var(--good-soft);color:var(--good)}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.dim{background:#EEF0F6;color:var(--slate)}
.badge.new{background:var(--navy);color:#fff}
/* SAMPLE marks a panel whose figures are seeded, not this account's. It must
   not look like the NEW badge, which advertises something real. */
.badge.sample{background:rgba(210,153,34,.16);color:#8A6410;font-weight:700}
.tag{display:inline-block;font-size:10.5px;font-weight:600;border-radius:5px;padding:2.5px 7px;background:var(--indigo-soft);color:var(--indigo-d);margin:2px 3px 0 0}

/* Toggle */
.sw{display:inline-block;width:36px;height:20px;border-radius:11px;background:#CBD1E4;position:relative;cursor:pointer;flex:none;transition:background .15s;border:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on{background:var(--good)}
.sw.on::after{left:18px}

/* Cards & layout atoms */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card .chead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card .chead h3{font-size:14px;font-weight:700}
.card .cbody{padding:18px}
.grid{display:grid;gap:14px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
/* Dashboard chart. The measure selector sits to the LEFT of the plot and the
   filters across the TOP, per the Chairman's layout. */
.dfilters{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.dfilter{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.dfilter select{font:inherit;font-size:12px;font-weight:500;letter-spacing:0;
  text-transform:none;color:var(--ink);background:#fff;border:1px solid var(--line);
  border-radius:7px;padding:4px 7px;max-width:170px}
.dchart{display:flex;gap:18px;align-items:stretch}
.dmetrics{display:flex;flex-direction:column;gap:7px;min-width:132px}
.dmetrics .dtotal{font-family:var(--mono);font-size:20px;font-weight:600;margin-top:10px;
  font-variant-numeric:tabular-nums}
.dmetrics .dtotlab{font-size:11px;color:var(--faint)}
.dplot{flex:1;display:flex;gap:3px;align-items:flex-end;height:190px;min-width:0}
.dbar{flex:1;border-radius:2px 2px 0 0;min-width:2px}
/* The analytics headline. Deliberately NOT .hero — that is the marketing page's
   full-bleed navy band, and reusing it inside a console card inherits a grid
   and 72px of padding. */
.anhero{border-color:var(--good);box-shadow:0 0 0 3px rgba(46,160,67,.10)}
@media(max-width:720px){.dchart{flex-direction:column}.dmetrics{flex-direction:row;flex-wrap:wrap;align-items:baseline}}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.stat .l{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-family:var(--mono);font-size:23px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .d{font-size:11.5px;margin-top:3px}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:12.8px}
.tbl th{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid #EEF1F8;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr.rowlink{cursor:pointer}
.tbl tbody tr.rowlink:hover{background:var(--indigo-soft)}
.tbl .num{white-space:nowrap}
.tblwrap{overflow-x:auto}

/* Bars */
.bar{display:flex;align-items:center;gap:10px;margin:7px 0}
.bar .bl{width:150px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bt{flex:1;height:9px;border-radius:5px;background:#EDF0F8;overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--indigo);border-radius:5px}
.bar .bv{width:88px;font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}

/* Sliders */
.wrow{display:flex;align-items:center;gap:10px;margin:6px 0}
.wrow .wl{width:72px;font-size:12.5px;font-weight:600}
.wrow input[type=range]{flex:1;accent-color:var(--indigo);height:4px}
.wrow .wv{width:34px;font-family:var(--mono);font-size:12px;text-align:right}

/* App shell */
.shell{display:flex;min-height:100vh}
.side{width:228px;flex:none;background:var(--navy);color:#B9C1E4;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .logo{display:flex;align-items:center;gap:9px;padding:18px 18px 14px;color:#fff;font-weight:700;font-size:15px;letter-spacing:.02em}
.side .logo .mark{width:26px;height:26px;border-radius:7px;background:var(--navy);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:14px;color:var(--gold)}
.side .org{margin:0 14px 12px;padding:9px 11px;border-radius:8px;background:var(--navy2);font-size:12.5px;color:#fff;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.side .org:hover{background:var(--navy3)}
.side .ng{padding:12px 18px 5px;font-size:10px;font-weight:700;letter-spacing:.14em;color:#6D77A8}
.side a.ni{display:flex;align-items:center;gap:10px;padding:8px 18px;color:#B9C1E4;font-size:13.2px;font-weight:500;border-left:3px solid transparent}
.side a.ni:hover{color:#fff;text-decoration:none;background:rgba(255,255,255,.04)}
.side a.ni.act{color:#fff;background:var(--navy2);border-left-color:var(--indigo)}
.side .ni .ic{width:17px;text-align:center;opacity:.85}
.side .demo{margin:auto 14px 14px;padding:10px 12px;border-radius:8px;background:var(--navy2);font-size:11.5px;line-height:1.45;color:#8F99C6}
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:30}
.topbar .crumb{font-size:13.5px;font-weight:600}
.topbar .env{margin-left:2px}
.topbar .sp{flex:1}
.topbar .who{display:flex;align-items:center;gap:9px;font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:22px;max-width:1240px;width:100%;margin:0 auto}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:21px;font-weight:700}
.ph .sub{font-size:13px;color:var(--slate);margin-top:3px}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:16px}

/* Drawer */
.dwrap{position:fixed;inset:0;z-index:60;display:none}
.dwrap.open{display:block}
.dback{position:absolute;inset:0;background:rgba(23,29,63,.42)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(480px,94vw);background:#fff;box-shadow:var(--sh-lg);overflow-y:auto;padding:22px;animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.dclose{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--faint);line-height:1}
.dclose:hover{color:var(--ink)}
.dh{font-size:17px;font-weight:700;margin:2px 0 3px}
.dsec{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:18px 0 8px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv .cell{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.kv .cell .k{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.kv .cell .v{font-family:var(--mono);font-size:13px;margin-top:3px;font-variant-numeric:tabular-nums}

/* Auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:linear-gradient(160deg,var(--paper) 55%,var(--indigo-soft))}
.abox{width:100%;max-width:420px}
.abox .alogo{display:flex;justify-content:center;align-items:center;gap:9px;margin-bottom:20px;font-weight:700;font-size:16px;color:var(--navy)}
.abox .alogo .mark{width:28px;height:28px;border-radius:8px;background:var(--navy);border:1.5px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:15px}
.acard{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-lg);padding:28px}
.acard h1{font-family:var(--disp);font-size:25px;font-weight:600;margin-bottom:4px}
.acard .asub{font-size:13.5px;color:var(--slate);margin-bottom:20px}
.afoot{text-align:center;font-size:13px;color:var(--slate);margin-top:16px}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--indigo)}
.codes{display:flex;gap:8px;justify-content:center}
.codes input{width:44px;height:52px;text-align:center;font-family:var(--mono);font-size:20px;border:1px solid var(--line);border-radius:8px}
.codes input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(91,91,214,.14)}
  .trialnote{border:1px solid var(--ok,#2ea043);background:rgba(46,160,67,.08);
    border-radius:10px;padding:12px 14px;margin:14px 0 4px;font-size:13px;line-height:1.5}
  .pp .per{font-size:12px;font-weight:400;opacity:.7}
.abox.wide{max-width:960px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:stretch}
.plan{border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;background:#fff;
  display:flex;flex-direction:column;text-align:left}
.plan:hover{border-color:var(--indigo-line)}
.plan.sel{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(91,91,214,.14)}
.plan h4{font-size:15px}.plan .pp{font-family:var(--mono);font-size:19px;margin:6px 0 2px}
.plan ul{margin:12px 0 0 16px;font-size:12.6px;color:var(--slate);flex:1 1 auto}
.plan li{margin:5px 0}
/* The choose button sits on the baseline of every card, so three cards of
   unequal feature counts still line their buttons up. */
.plan .pick{margin-top:16px;width:100%;justify-content:center}
.plan.sel .pick{background:var(--indigo);border-color:var(--indigo);color:#fff}
@media(max-width:820px){.plans{grid-template-columns:1fr}.plan ul{flex:0 0 auto}}

/* Marketing */
.mk{background:#fff}
.mnav{position:sticky;top:0;z-index:50;background:rgba(18,25,63,.94);backdrop-filter:blur(8px);color:#fff;display:flex;align-items:center;gap:26px;padding:0 max(24px,5vw);height:60px;border-bottom:1px solid rgba(198,162,65,.5)}
.mnav .brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:600;font-size:18px;letter-spacing:.01em;color:#fff}
.mnav .brand .crestmk{width:26px;height:31px;display:block;flex:none}
.mnav a.ml{color:#C9C0A6;font-size:13.5px;font-weight:500}
.mnav a.ml:hover{color:var(--gold);text-decoration:none}
/* Heraldic crest + seal */
.crestmk .fill-navy{fill:#12193F}.crestmk .st-gold{stroke:#C6A241}.crestmk .fill-gold{fill:#C6A241}
.seal{display:block;filter:drop-shadow(0 6px 16px rgba(0,0,0,.35))}
.sealtxt{font-family:var(--ui);font-weight:700;letter-spacing:.16em;fill:#C6A241}
.hero-crest{margin-bottom:22px}
.mnav .sp{flex:1}
.hero{background:var(--navy);color:#fff;padding:72px max(24px,5vw) 84px;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;overflow:hidden;position:relative}
.hero h1{font-family:var(--disp);font-size:clamp(34px,4.6vw,56px);font-weight:600;line-height:1.08;letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:#E6C978}
.hero .hsub{font-size:16.5px;line-height:1.6;color:#B9C1E4;margin:20px 0 28px;max-width:52ch}
.hero .hstats{display:flex;gap:26px;margin-top:34px;flex-wrap:wrap}
.hero .hstat .n{font-family:var(--mono);font-size:21px;font-weight:600;color:#fff}
.hero .hstat .t{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#7D88BE;margin-top:2px}
.ledger{background:#10152F;border:1px solid #2A3364;border-radius:14px;box-shadow:var(--sh-lg);overflow:hidden;font-family:var(--mono);font-size:11.6px}
.ledger .lh{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid #2A3364;color:#8F99C6;font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.ledger .live{display:inline-flex;align-items:center;gap:6px;color:#5BE49B;font-size:10.5px}
.ledger .live i{width:7px;height:7px;border-radius:50%;background:#5BE49B;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ledger .lrow{display:grid;grid-template-columns:56px 1fr 140px 70px;gap:10px;padding:8px 16px;border-bottom:1px solid #1B2246;color:#AEB7DE;white-space:nowrap;animation:rowin .3s ease-out}
@keyframes rowin{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.ledger .lrow .m{color:#6D77A8;overflow:hidden;text-overflow:ellipsis}
.ledger .lrow .c{color:#5BE49B;text-align:right}
.ledger .lrow .rv{color:#7D88BE;text-align:right;overflow:hidden;text-overflow:ellipsis}
.ledger .lfoot{padding:9px 16px;color:#6D77A8;font-family:var(--ui);font-size:11px}
/* Provider ribbon (infinite marquee) */
.provribbon{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;overflow:hidden;position:relative}
.provribbon::before,.provribbon::after{content:"";position:absolute;top:0;bottom:0;width:110px;z-index:2;pointer-events:none}
.provribbon::before{left:0;background:linear-gradient(90deg,#fff,rgba(255,255,255,0))}
.provribbon::after{right:0;background:linear-gradient(270deg,#fff,rgba(255,255,255,0))}
.provtrack{display:flex;align-items:center;width:max-content;animation:provslide 55s linear infinite;will-change:transform}
.provribbon:hover .provtrack{animation-play-state:paused}
@keyframes provslide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.provlogo{display:inline-flex;align-items:center;gap:9px;margin:0 26px;color:var(--faint);flex:none;opacity:.68;transition:opacity .2s,color .2s}
.provlogo:hover{opacity:1;color:var(--slate)}
.provlogo svg{width:23px;height:23px;flex:none;fill:currentColor}
.provlogo b{font-size:14px;font-weight:600;white-space:nowrap}
@media(prefers-reduced-motion:reduce){.provtrack{animation:none}}
.sect{padding:76px max(24px,5vw);scroll-margin-top:70px}
.sect.alt{background:var(--paper)}
.sect .shead{max-width:760px;margin-bottom:40px}
.sect h2{font-family:var(--disp);font-size:clamp(26px,3vw,36px);font-weight:600;line-height:1.15;margin-top:10px}
.sect .ssub{font-size:15px;color:var(--slate);margin-top:12px;line-height:1.65}
.moats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.moat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--sh);border-top:3px solid var(--gold)}

/* ── stale-tab guard ────────────────────────────────────────────────────────
   This is a hash-routed SPA: #/routes never reload the document, so a tab left
   open across a deploy keeps running its old JavaScript. On 2026-09-10 that
   made an already-fixed signup bug look unfixed. The page remembers the build
   it booted with and offers a reload when the server reports a different one.
   It never reloads by itself -- doing that mid-form would discard whatever the
   person had typed. */
var BOOT_BUILD=null;
async function checkBuild(){
  try{
    const res=await fetch('/version.json?t='+Date.now(),{cache:'no-store'});
    if(!res.ok) return;
    const {build}=await res.json();
    if(!build) return;
    if(BOOT_BUILD===null){BOOT_BUILD=build;return}
    if(build!==BOOT_BUILD) showUpdateBanner();
  }catch(_){/* offline or mid-deploy: try again on the next tick */}
}
function showUpdateBanner(){
  if(document.getElementById('update-banner')) return;
  const d=document.createElement('div');
  d.id='update-banner';
  d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:12px 16px;'
    +'background:#101a2c;color:#fff;display:flex;gap:14px;align-items:center;'
    +'justify-content:center;font-size:14px;box-shadow:0 -2px 12px rgba(0,0,0,.35)';
  d.innerHTML='A newer version of this page is available. '
    +'<button id="update-now" style="background:#fff;color:#101a2c;border:0;border-radius:6px;'
    +'padding:7px 14px;font:inherit;font-weight:600;cursor:pointer">Reload</button>';
  document.body.appendChild(d);
  document.getElementById('update-now').onclick=function(){location.reload(true)};
}

async function api(path,opts){
  const o=Object.assign({credentials:'same-origin',headers:{}},opts||{});
  if(o.body&&typeof o.body!=='string'){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.body)}
  const res=await fetch('/api'+path,o);
  let data=null;try{data=await res.json()}catch(_){}
  return {ok:res.ok,status:res.status,data:data||{}};
}

function mkDonut(title,rows,fmt){
  const total=rows.reduce((s,r)=>s+r.value,0);
  const R=54,SW=22,C=2*Math.PI*R,cx=70,cy=70;let off=0,seg='',leg='';
  rows.forEach((r,i)=>{const f=r.value/total,len=f*C,col=MKVEN[r.name]||MKPAL[i%MKPAL.length];
    seg+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${col}" stroke-width="${SW}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"><title>${r.name}: ${fmt(r.value)} (${(f*100).toFixed(1)}%)</title></circle>`;
    off+=len;
    leg+=`<div class="anleg-i"><span class="andot" style="background:${col}"></span><span class="anleg-n">${r.name}</span><span class="anleg-v">${(f*100).toFixed(0)}%</span></div>`;});
  return `<div class="ancard"><div class="antitle">${title}</div><div class="anbody"><svg viewBox="0 0 140 140" width="140" height="140" class="andonut" role="img" aria-label="${title}">${seg}<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" class="anctr">${fmt(total)}</text></svg><div class="anleg">${leg}</div></div></div>`;
}
function mkBars(title,rows,fmt){
  const max=Math.max(...rows.map(r=>r.value));let b='';
  rows.forEach((r,i)=>{const pct=(r.value/max*100).toFixed(1),col=MKPAL[i%MKPAL.length];
    b+=`<div class="anbar-r"><span class="anbar-l" title="${r.name}">${r.name}</span><span class="anbar-t"><span class="anbar-f" style="width:${pct}%;background:${col}"></span></span><span class="anbar-v">${fmt(r.value)}</span></div>`;});
  return `<div class="ancard"><div class="antitle">${title}</div><div class="anbars">${b}</div></div>`;
}
const _usdk=n=>n>=1000?'$'+Math.round(n/100)/10+'k':'$'+n;
function mkVBars(title,rows,fmt){
  const max=Math.max(...rows.map(r=>r.value));let c='';
  rows.forEach((r,i)=>{const h=(r.value/max*150).toFixed(0),col=MKPAL[i%MKPAL.length];
    c+=`<div class="anvcol"><div class="anvval">${fmt(r.value)}</div><div class="anvbar" style="height:${h}px;background:${col}" title="${r.name}: ${fmt(r.value)}"></div><div class="anvlab" title="${r.name}">${r.name}</div></div>`;});
  return `<div class="ancard"><div class="antitle">${title}</div><div class="anvwrap">${c}</div></div>`;
}

   <section class="sect" id="why">
    <div class="shead"><span class="kicker">Why teams switch</span>
     <h2>Observability tools estimate what you spent. We itemize, attribute, and reconcile what you owe.</h2>
     <p class="ssub">Gateways multiply token counts by a current price sheet. When a provider changes prices mid-month, every dashboard silently diverges from the invoice. Agent U rates each request at execution time against effective-dated rate cards — the discipline carrier billing has used for forty years, applied to LLM traffic.</p></div>
    <div class="moats">
     <div class="moat"><div class="mi">Σ</div><h3>The rating engine</h3><p>Effective-dated tariffs with versioned history, "as of" re-pricing to any point in time, per-bucket rating of input, cache-read, cache-write, output and reasoning tokens — every charge stamped with the rate version that produced it.</p></div>
     <div class="moat"><div class="mi">⛨</div><h3>The immutable fence</h3><p>Prompt prefixes and suffixes enforced at the proxy, inherited from client to subclient to app. Sentinel tokens defeat forged-fence injection, and a post-wrap audit log shows your policy fired — outside the reach of apps and users.</p></div>
     <div class="moat"><div class="mi">⌥</div><h3>The attribution tree</h3><p>Five levels of chargeback — client, subclient, app, account, user — with routing weights and hard spend limits inherited down the tree. Built for enterprises, and for MSPs who rebill every end-client.</p></div>
    </div>
   </section>

   <section class="sect alt" id="analytics">
    <div class="shead"><span class="kicker">The ledger, visualized</span>
     <h2>See exactly where the tokens and the spend go.</h2>
     <p class="ssub">Every rated Token Detail Record rolls up by provider and by application in real time. Know which vendor and which app is driving cost before the invoice lands, not after.</p></div>
    <div class="angrid">
     ${mkDonut('Tokens per vendor',MK_VEN_TOK,_tk)}
     ${mkDonut('Charges per vendor',MK_VEN_CHG,_usd)}
     ${mkBars('Tokens by application',MK_APP_TOK,_tk)}
     ${mkBars('Charges by application',MK_APP_CHG,_usd)}
     ${mkVBars('Charges by department',MK_DEPT_CHG,_usdk)}
     ${mkVBars('Top 10 users by charges',MK_USER_CHG,_usdk)}
    </div>
    <div class="annote">Illustrative figures. Your console renders live data from your own traffic.</div>
   </section>

   <section class="sect" id="product">
    <div class="shead"><span class="kicker">The console</span><h2>Everything between your apps and the model market.</h2></div>
    <div class="shots">
     <div class="shot"><div class="sn">01 · CATALOG</div><h4>Providers &amp; models</h4><p>Fleet-wide toggles, quality tiers, validated keys and a live intelligence feed of releases, price changes and benchmarks.</p></div>
     <div class="shot"><div class="sn">02 · ROUTE</div><h4>Smart model routing</h4><p>Weighted routing across the fleet. Score every model on price, performance, capability and security, then send each call to the best-fit model, with health-scored failover across providers.</p></div>
     <div class="shot"><div class="sn">03 · TARIFFS</div><h4>Rate cards</h4><p>The master pricing ledger. Schedule changes, audit history, re-price to any date.</p></div>
     <div class="shot"><div class="sn">04 · GOVERN</div><h4>Clients &amp; policy</h4><p>Hierarchical identities, LCR weight sliders, enforcement wrappers with sentinel protection.</p></div>
     <div class="shot"><div class="sn">05 · LEDGER</div><h4>Request log</h4><p>Every TDR, drillable to its billable buckets and the exact rate in force at execution.</p></div>
     <div class="shot"><div class="sn">06 · RECONCILE</div><h4>Reconciliation</h4><p>Import the provider's invoice; get matched, rate-variance, quantity-variance and unmatched lines.</p></div>
     <div class="shot"><div class="sn">07 · CONTROL</div><h4>Spend limits</h4><p>Hard caps that deny at threshold — not alerts after the money is gone.</p></div>
     <div class="shot"><div class="sn">08 · WEIGHTS</div><h4>Selection weights</h4><p>Tune model-selection weights by client, application and department. Dial price, performance, capability and security to each team's mandate.</p></div>
    </div>
   </section>

    <div class="shead"><span class="kicker">Pricing</span><h2>Price the record, not the requests.</h2>
    <p class="ssub">Every tier is the whole product. Tiers differ by how many keys you can mint — one per developer, agent or app, each separately attributed in the ledger — and by whether you can organize them into your own departments and roles. The more you commit to, the less each key costs. All start with a 30-day free trial, no credit card required.</p></div>

   <section class="sect faq" id="faq">
    <div class="shead"><span class="kicker">FAQ</span><h2>Fair questions.</h2></div>
    <details><summary>We already run LiteLLM. Why add this?</summary><p>Keep it. Agent U sits as proxy of record in front of (or beside) your gateway and adds what it will never have: rating against effective-dated tariffs, an immutable as-billed ledger, invoice reconciliation, and policy your own developers can't remove.</p></details>
    <details><summary>Doesn't another hop add latency and risk?</summary><p>We publish overhead numbers, stream responses through, and let you set fail-open or fail-closed per node. In practice the proxy absorbs provider outages your apps would otherwise eat, with health-scored failover across providers.</p></details>
    <details><summary>Is our data used for anything?</summary><p>No. Prompts and completions transit for routing, fencing and metering; the ledger stores rated metadata.</p></details>
    <details><summary>What does "hard limit" actually mean?</summary><p>Deny at threshold — the request is refused when the cap is reached, enforced in the hot path, not an alert after the fact. Soft limits that alert are also available per node.</p></details>
   </section>

function ledgerRow(i){
  const t=TDRS[i%TDRS.length];

/* Step 1 -> the hub emails a 6-digit code. The response is deliberately the
   same whether or not the address is already registered, so this screen can
   never be used to discover who is a customer. */
async function startSignup(e){e.preventDefault();
  const email=$('#su-e').value.trim(),err=$('#su-err'),btn=$('#su-go');
  err.style.display='none';btn.disabled=true;btn.textContent='Sending…';
  const r=await api('/auth/signup/start',{method:'POST',body:{email}});
  btn.disabled=false;btn.textContent='Send confirmation code';
  if(!r.ok){
    err.textContent=r.status===429
      ? 'Too many attempts from this network. Please wait a few minutes.'
      : 'Could not send the code. Please check the address and try again.';
    err.style.display='';return false}
  // The address already has an account, so NO code was issued. Say so here
  // rather than advancing to a code screen that could never be satisfied --
  // that dead end is exactly what this check exists to prevent.
  if(r.data && r.data.status==='exists'){
    err.innerHTML='That email already has an account. '
      +'<a href="#/login">Sign in</a> or <a href="#/forgot">reset your password</a>.';
    err.style.display='';return false}
  S.pending={email};
  go('#/verify');return false}

/* Confirm the password was typed the same twice.

   Checked live AND again at submit. The live check is the courtesy; the submit
   check is the one that matters, because a mismatch that reaches the server
   creates an account whose owner cannot sign in -- and the password is never
   recoverable, only resettable by email.

   Deliberately quiet until the second field has something in it: telling
   someone their passwords do not match before they have finished typing the
   first character of the confirmation is noise, not help. */
function pwMatch(){
  const a=$('#su-p'), b=$('#su-p2'), out=$('#pw-match');
  if(!a||!b||!out) return true;
  const typed=b.value.length>0;
  const ok=a.value===b.value;
  if(!typed){ out.textContent=''; out.style.color=''; b.setCustomValidity(''); return false; }
  out.textContent = ok ? 'Passwords match.' : 'Passwords do not match.';
  out.style.color = ok ? 'var(--ok,#2ea043)' : 'var(--bad,#f85149)';
  // setCustomValidity also blocks the browser's own submit, so the guard holds
  // even if script below it were to change.
  b.setCustomValidity(ok ? '' : 'Passwords do not match.');
  return ok;
}

/* Step 3 -> create the account, presenting the proof from step 2. The user is
   created ALREADY verified, so no confirmation link is sent and the approval
   request reaches the Chairman immediately. */
/* Step 3 -> collect the details, then hand off to the PLAN step.

   The account is not created until a plan is chosen. Registering first and
   changing the tier afterwards would mean every signup briefly exists on a tier
   nobody picked, and the plan decides the key quota. */
async function finishSignup(e){e.preventDefault();
  const st=S.pending||{},err=$('#fs-err'),btn=$('#fs-go');
  if(!st.signup_token){go('#/signup');return false}
  // Re-checked at submit, not just on input: an account created from a
  // mistyped password locks its owner out of the thing they just paid for.
  if($('#su-p').value !== $('#su-p2').value){
    err.textContent='The two passwords do not match. Re-enter them and try again.';
    err.style.display='';
    $('#su-p2').focus();
    return false}
  err.style.display='none';
  // Carried in memory to the plan step, never stored. Cleared the moment the
  // account is created (see doPlan).
  S.pending={...st, name:$('#su-n').value.trim(),
             company:$('#su-c').value.trim()||null, password:$('#su-p').value};
  go('#/plan');
  return false}

/* Step 4 -> pick a plan, THEN create the account. */
async function doPlan(){
  const st=S.pending||{},err=$('#pl-err'),btn=$('#pl-go');
  if(!st.signup_token||!st.password){go('#/signup');return false}
  if(err){err.style.display='none'}
  if(btn){btn.disabled=true;btn.textContent='Starting your trial…'}
  const r=await api('/auth/register',{method:'POST',body:{
    email:st.email,name:st.name,company:st.company,
    password:st.password,signup_token:st.signup_token,plan:S.plan}});
  if(btn){btn.disabled=false;btn.textContent='Start free trial'}
  if(!r.ok){
    let m='Could not create the account. Please try again.';
    if(r.status===409){m='That email is already registered. <a href="#/login">Sign in</a> instead.';}
    else if(r.status===400){m='Your email confirmation expired. <a href="#/signup">Start again</a>.';}
    else if(r.status===422&&Array.isArray(r.data.detail)){
      m=r.data.detail.map(d=>d.msg||'').filter(Boolean).join(' ')||m;}
    err.innerHTML=m;err.style.display='';return false}
  // Drop the password the instant it is no longer needed.
  S.pending={email:st.email};
  go('#/pending');return false}

   PENDING account that a human approves, so a separate form would be a second
   front door to the same place. The old one silently discarded submissions and

/* ONE place that turns the /auth/me payload into session state.

   This existed twice -- once for the moment of signing in, once for arriving
   with a cookie already set -- and the two drifted: the account's real plan was
   added to one and not the other, so a signed-in user saw the correct tier on
   reload and a hardcoded "Control" right after logging in. Same enumerated-field
   trap as the record builders on the server. One function, both callers. */
function applyIdentity(m){
  S.authed=true;S.demo=false;
  S.account={id:m.account_id,name:m.account_name,status:m.account_status};
  S.user={name:m.account_name||m.email,email:m.email,
          role:(m.role||'').replace(/^./,c=>c.toUpperCase())};
  S.org={name:m.account_name||'Your organization',
         slug:(m.account_name||'org').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')};
  // The account's real tier. Without it S.plan keeps the signup picker's
  // default and every user is shown "Control", overstating how many keys they
  // may mint. Blank leaves the default rather than rendering an empty name.
  // Only claim a tier we were actually told. Falling back to the signup
  // picker's 'control' default named a specific paid tier, and its key
  // allowance, for an account whose plan the hub did not report.
  if(m.account_plan){ S.plan=m.account_plan; S.planKnown=true; }
  else { S.planKnown=false; }
}

async function afterAuthed(){
  const r=await api('/auth/me');
  if(!r.ok){go('#/login');return}
  applyIdentity(r.data);
  go('#/app');
}
async function ensureSession(){
  if(S.demo||S.authed)return true;
  const r=await api('/auth/me');
  if(r.ok){applyIdentity(r.data);return true}
  return false;
}

/* ---------- live console hydration (authed sessions only) ---------- */
function hydrateLive(r){
  // Every console page shows the nav, so the count is refreshed on each
  // hydration rather than once at sign-in -- otherwise adding a connector
  // leaves a stale number in the menu until a reload.
  loadConnectorCount();
  if(r==='#/app'){loadDashCounts();loadDashSeries();}
  else if(r==='#/app/requests')loadRequests();
  else if(r==='#/app/analytics')loadAnalytics();
  else if(r==='#/app/usage')loadUsage(30,false);
  else if(r==='#/app/keys')hydrateKeys();
  else if(r==='#/app/providers')loadProviders(true);
  else if(r==='#/app/org')loadOrg(true);
  // Advisory needs its model list before the operator can choose one.

async function loadRequests(force){
  if(!S.authed || S.demo) return;
  // A LATCH, not an in-flight flag. Both end in render(), and render() runs the
  // route hook that calls this -- so a flag that clears on completion just
  // restarts the cycle. Same shape as the dashboard's guard, same reason.
  if(window.__reqLoading) return;
  if(window.__reqLoaded && !force) return;
  window.__reqLoading = true;
  window.__reqLoaded = true;
  const r=await api('/account/requests?limit=200');
  window.__reqLoading = false;
  if(!r.ok){
    // The endpoint used to 404 and this returned silently, leaving the SEEDED
    // rows on screen under a "Production" badge. An empty ledger is a better
    // lie than someone else's-looking data: show nothing and say why.
    TDRS=[]; window.__reqTotal=0; window.__reqError=(r.data&&r.data.error)||('HTTP '+r.status);
    // The latch STAYS SET on failure. Clearing it here and then calling render()
    // re-enters through the route hook and retries forever -- a failing upstream
    // would have the console hammering it in a tight loop. Refresh(true) is the
    // way back, and the message on screen says so.
    render(); return;
  }
  window.__reqError='';
  TDRS=(r.data.rows||[]).map(x=>({t:new Date(x.t),client:x.client,sub:x.sub,app:x.app,prompt:x.prompt||'',prov:x.prov,model:x.model||'',ok:!!x.ok,lat:x.lat||0,tin:x.tin||0,tout:x.tout||0,cost:x.cost||0}));
  window.__reqTotal=(r.data.total!=null?r.data.total:TDRS.length);
  render();
}

function buildLiveModels(provs){

    const pid=(p.provider||'').toLowerCase();

  });

   credentials this account holds, because a NEW account has none and an empty
   list is the most common reason the rest of the console cannot do anything --
   the advisory dropdown is empty, and BYO routing has nothing to route on.
   Surfacing "(0)" in the menu makes that visible before the user goes looking.

   The count is OMITTED until it is known. Rendering "(0)" while the fetch is in
   flight would state that the account has no connectors, which is a different
   claim from "we have not asked yet" -- and it would be wrong for every account
   that does have some. */
function navLabel(item){
  if(item[0] !== '/keys.html') return item[2];
  return S.connectors === null || S.connectors === undefined
    ? item[2]
    : `${item[2]} (${S.connectors})`;
}

/* Counts ACTIVE connectors only. "Active" is decided by the server, from the
   same predicate the router selects on (aiproxy_core.credential_is_active), so
   the number in the menu means exactly what the proxy is willing to route on.
   A connector is inactive when it is soft-deleted, when no secret is stored in
   the vault behind it, or when it names no vendor -- in every one of those
   cases it cannot serve a call, so counting it would overstate what the
   account can actually do.

   Legacy entries come back as plain masked strings rather than records. The
   server only returns one at all when it holds a usable key, so a string
   counts as active. */
async function loadConnectorCount(){
  if(!S.authed || S.demo) return;
  try{
    const r = await api('/account/provider-keys');
    if(!r.ok || !r.data) return;
    const pk = r.data.provider_keys || {};
    const live = Object.values(pk).filter(v =>
      typeof v === 'string' ? v.trim() !== '' : !!(v && v.active)).length;
    if(live !== S.connectors){ S.connectors = live; render(); }
    else S.connectors = live;
  }catch(e){ /* a count must never break the console */ }
}

/* ---------- Dashboard ---------- */
/* ─────────────────────────  DASHBOARD  ─────────────────────────
   Chairman, 2026-09-13: four counts across the top (Active keys, Active
   models, Roles, Departments), then a vertical bar chart with a measure
   selector on its LEFT (Requests / Tokens / Charges) and filter dropdowns
   across its TOP (Department, Role, Keys), each defaulting to All.

   Every number here is this account's own. The old dashboard drew from DAILY
   and SUM -- seeded constants -- which is fine for a tour and indefensible on
   the first screen of a governance product. Where a figure is not loaded yet it
   shows a dash, never a zero: "we have not asked" and "you have none" are
   different claims and only one of them is ours to make. */

const DASH = {
  counts: {keys:null, models:null, roles:null, departments:null},
  metric: 'requests',
  filters: {department:'', role:'', key_id:''},
  options: {departments:[], roles:[], keys:[]},
  series: null,      // null = not loaded yet; [] = loaded and genuinely empty
  loading: false,
  // Re-entry guards. Both loaders end in render(), and render() runs the route
  // hook that starts them -- so without these the dashboard spins forever the
  // moment it loads anything. `countsLoaded` is a latch; `seriesKey` records
  // WHICH filter combination the loaded series belongs to, so a filter change
  // still refetches while a repaint does not.
  countsLoaded: false,
  seriesKey: null,
};

function dashSeriesKey(){
  const f = DASH.filters;
  return [f.department, f.role, f.key_id].join('|');
}

const DASH_METRICS = [
  ['requests', 'Requests', v => fmt(v)],
  ['tokens',   'Tokens',   v => fmt(v)],
  ['cost_usd', 'Charges',  v => money(v)],
];

function dashCount(n){ return (n === null || n === undefined) ? '—' : fmt(n); }

function pageDash(){
  const live = S.authed && !S.demo;
  const m = DASH_METRICS.find(x => x[0] === DASH.metric) || DASH_METRICS[0];
  const rows = DASH.series || [];
  const peak = Math.max(...rows.map(r => Number(r[m[0]]) || 0), 0);

  const bars = !DASH.series
    ? '<div class="muted" style="align-self:center;width:100%;text-align:center;font-size:13px">Loading…</div>'
    : !rows.length
      ? '<div class="muted" style="align-self:center;width:100%;text-align:center;font-size:13px">No requests in this window for the selected filters.</div>'
      : rows.map(r => {
          const v = Number(r[m[0]]) || 0;
          // A zero-value day keeps a hairline so the day still reads as present.
          const h = peak > 0 ? Math.max(v > 0 ? 4 : 1, v / peak * 100) : 1;
          return `<div class="dbar" title="${esc(r.date)} · ${m[2](v)}"
                       style="height:${h}%;background:${r.errors > 0 ? 'var(--warn)' : 'var(--indigo)'}"></div>`;
        }).join('');

  const sel = (id, label, opts, val) => `
    <label class="dfilter"><span>${label}</span>
     <select onchange="dashFilter('${id}', this.value)">
      <option value="">All</option>
      ${opts.map(o => `<option value="${esc(o[0])}" ${val === o[0] ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}
     </select></label>`;

  return appShell('Dashboard', `${esc(S.org?.name || S.account?.name || 'Your account')} · last 30 days`, `
   <div class="statgrid">
    <div class="stat"><div class="l">Active keys</div><div class="v" id="dash-keys">${dashCount(DASH.counts.keys)}</div><div class="d muted">able to call the proxy</div></div>
    <div class="stat"><div class="l">Active models</div><div class="v" id="dash-models">${dashCount(DASH.counts.models)}</div><div class="d muted">switched on for this account</div></div>
    <div class="stat"><div class="l">Roles</div><div class="v" id="dash-roles">${dashCount(DASH.counts.roles)}</div><div class="d muted">grants a key may hold</div></div>
    <div class="stat"><div class="l">Departments</div><div class="v" id="dash-depts">${dashCount(DASH.counts.departments)}</div><div class="d muted">spend is attributed to these</div></div>
   </div>

   <div class="card" style="margin-top:14px">
    <div class="chead">
     <h3>Activity${live ? '' : ' <span class="illus">Demo</span>'}</h3>
     <div class="dfilters">
      ${sel('department', 'Department', DASH.options.departments, DASH.filters.department)}
      ${sel('role', 'Role', DASH.options.roles, DASH.filters.role)}
      ${sel('key_id', 'Keys', DASH.options.keys, DASH.filters.key_id)}
     </div>
    </div>
    <div class="cbody dchart">
     <div class="dmetrics">
      ${DASH_METRICS.map(x => `<button class="btn sm ${DASH.metric === x[0] ? '' : 'ghost'}"
            onclick="dashMetric('${x[0]}')">${x[1]}</button>`).join('')}
      <div class="dtotal">${DASH.series ? m[2](rows.reduce((a, r) => a + (Number(r[m[0]]) || 0), 0)) : '—'}</div>
      <div class="dtotlab">${m[1]}, 30 days</div>
     </div>
     <div class="dplot" id="dash-chart">${bars}</div>
    </div>
   </div>`);
}

function dashMetric(id){ DASH.metric = id; render(); }

function dashFilter(which, value){
  DASH.filters[which] = value;
  DASH.series = null;       // back to "not loaded", so no stale bars are shown
  DASH.seriesKey = null;
  render();
  loadDashSeries();
}

/* The four counts, each from the surface that owns it. A failure leaves its
   count null (rendered as a dash) instead of zero -- a dashboard that says 0
   departments when the request merely failed sends someone to build one that
   already exists. */
async function loadDashCounts(force){
  if(!S.authed || S.demo) return;
  if(DASH.countsLoaded && !force) return;
  DASH.countsLoaded = true;
  const put = (k, v) => { DASH.counts[k] = v; };
  const [keys, models, roles, org] = await Promise.all([
    api('/account/keys'), api('/account/models'),
    api('/account/roles'), api('/org/overview'),
  ]);
  if(keys.ok && Array.isArray(keys.data))
    put('keys', keys.data.filter(k => k.active !== false).length);
  if(models.ok && models.data)
    put('models', (models.data.models || []).length);
  if(roles.ok && roles.data){
    const rs = roles.data.roles || [];
    put('roles', rs.length);
    DASH.options.roles = rs.map(r => [r.role_id, r.name || r.role_id]);
  }
  if(org.ok && org.data){
    const ds = org.data.departments || [];
    put('departments', ds.length);
    DASH.options.departments = ds.map(d => [d.slug, d.name || d.slug]);
  }
  if(keys.ok && Array.isArray(keys.data))
    DASH.options.keys = keys.data.filter(k => k.active !== false)
      .map(k => [k.key_id, k.name || k.key_id]);
  render();
}

async function loadDashSeries(){
  if(!S.authed || S.demo){ DASH.series = []; return; }
  const key = dashSeriesKey();
  // Already showing this exact combination, or already fetching it.
  if(DASH.loading || (DASH.series !== null && DASH.seriesKey === key)) return;
  DASH.loading = true;
  DASH.seriesKey = key;
  const f = DASH.filters;
  const q = `days=30&department=${encodeURIComponent(f.department)}`
          + `&role=${encodeURIComponent(f.role)}&key_id=${encodeURIComponent(f.key_id)}`;
  const r = await api('/account/usage-series?' + q);
  DASH.loading = false;
  // An error leaves the chart in its loading state rather than drawing an empty
  // one: "no data" is a claim about the account, not about the request.
  if(!r.ok || !r.data){ DASH.seriesKey = null; return; }
  DASH.series = r.data.series || [];
  render();
}

async function loadProviderNews(id){

// Authoritative Hugging Face org pages for open-weight vendors. Closed/API-only
// vendors (anthropic, openai, google, xai, amazon, perplexity) get no link — HF
// hosts no official repo for them, so a search would only surface mirrors.
const HF_ORG={meta:'meta-llama',mistral:'mistralai',deepseek:'deepseek-ai',alibaba:'Qwen',
  zhipu:'zai-org',moonshot:'moonshotai',microsoft:'microsoft',minimax:'MiniMaxAI',
  bytedance:'ByteDance-Seed',cohere:'CohereForAI'};
function hfLink(pid,name){
  const org=HF_ORG[(pid||'').toLowerCase()];if(!org)return '';
  const url='https://huggingface.co/'+org+'?search_models='+encodeURIComponent(name);
  return `<a class="btn sm ghost" href="${url}" target="_blank" rel="noopener">Hugging Face ↗</a>`;
}
// Open-weight models carry no hosted API price (input+output both 0). Show a
// "self-host" label instead of a misleading $0.00.
function isOpenWeight(m){return (Number(m[4])||0)===0&&(Number(m[7])||0)===0}
const OW_LABEL='<span class="badge dim" title="Open-weight model — self-host, no hosted API price">Open weights · self-host</span>';
/* Live LMSYS Text-Arena ELO bars. Ranks every live model that carries an ELO
   (m[10]), always includes the current model, highlights it. Returns '' when no
   live ELO exists (demo mode / no snapshot) so the caller shows illustrative bars. */
function eloBars(cur){
  const ranked=[];
  Object.keys(MODELS).forEach(k=>MODELS[k].forEach(x=>{const e=Number(x[10])||0;if(e>0)ranked.push([x[0],e,x[1]===cur[1]]);}));
  if(!ranked.length)return '';
  ranked.sort((a,b)=>b[1]-a[1]);
  const curElo=Number(cur[10])||0;
  let rows=ranked.slice(0,5);
  if(curElo>0&&!rows.some(r=>r[2])){rows=ranked.slice(0,4);rows.push(ranked.find(r=>r[2]));}
  const bars=rows.map(r=>`<div class="bar"><span class="bl" style="width:160px;${r[2]?'font-weight:700':''}">${r[0]}</span><span class="bt"><i style="width:${Math.max(4,Math.min(100,(r[1]-1300)/2))}%;${r[2]?'':'background:#C7CDE8'}"></i></span><span class="bv">${r[1]}</span></div>`).join('');
  const note=curElo>0?'':`<p class="muted" style="font-size:12px;margin-top:6px">${cur[0]} isn't ranked on the LMSYS Text Arena (top 20 only). Bars show current frontier models for context.</p>`;
  return bars+note;
}
/* Live Artificial Analysis Intelligence Index bars (m[11]). Covers ~100+ models
   where Arena's top-20 stops. Same shape as eloBars; '' when no live AA data. */
function aaBars(cur){
  const ranked=[];
  Object.keys(MODELS).forEach(k=>MODELS[k].forEach(x=>{const s=Number(x[11])||0;if(s>0)ranked.push([x[0],s,x[1]===cur[1]]);}));
  if(!ranked.length)return '';
  ranked.sort((a,b)=>b[1]-a[1]);
  const curS=Number(cur[11])||0;
  let rows=ranked.slice(0,6);
  if(curS>0&&!rows.some(r=>r[2])){rows=ranked.slice(0,5);rows.push(ranked.find(r=>r[2]));}
  const bars=rows.map(r=>`<div class="bar"><span class="bl" style="width:160px;${r[2]?'font-weight:700':''}">${r[0]}</span><span class="bt"><i style="width:${Math.max(4,Math.min(100,r[1]/70*100))}%;${r[2]?'':'background:#C7CDE8'}"></i></span><span class="bv">${r[1]}</span></div>`).join('');
  const note=curS>0?'':`<p class="muted" style="font-size:12px;margin-top:6px">${cur[0]} has no Artificial Analysis Intelligence score yet.</p>`;
  return bars+note;
}
function openModel(pid,slug){
  const m=(MODELS[pid]||[]).find(x=>x[1]===slug);if(!m)return;
  const ow=isOpenWeight(m);
  const blended=(m[4]+m[7])/2/1000;
  openDrawer(`
   <div style="display:flex;gap:8px;align-items:center"><span class="badge">${PROVIDERS.find(p=>p.id===pid).n}</span>${m[3]?`<span class="badge frontier">${m[3]}</span>`:''}<span class="badge ${m[2]==='fast'?'ok':'dim'}">${m[2]}</span></div>
   <div class="dh" style="margin-top:8px">${m[0]}</div><div class="mono faint" style="font-size:11.5px">${m[1]}</div>
   <div class="dsec">Specifications</div>
   <div class="kv">${(ow?[['Pricing',OW_LABEL],['Context',m[8]?fmtTok(m[8]):'1M tokens'],['Max output',m[9]?fmtTok(m[9]):'300K tokens']]:[['Input /1M',money(m[4])],['Output /1M',money(m[7])],['Cache read /1M',m[5]>0?money(m[5]):'—'],['Cache write /1M',m[6]>0?money(m[6]):'—'],['Context',m[8]?fmtTok(m[8]):'1M tokens'],['Max output',m[9]?fmtTok(m[9]):'300K tokens']]).map(x=>`<div class="cell"><div class="k">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('')}</div>
   <div class="dsec">Monthly cost estimates</div>
   ${ow?`<p class="muted" style="font-size:12.5px">No metered token cost — open-weight model you host yourself. You pay compute/infra, not per-token API fees.</p>`:`<div class="kv" style="grid-template-columns:1fr 1fr 1fr">${[['1M tokens',money(blended*1e3,2)],['10M',money(blended*1e4,0)],['100M',money(blended*1e5,0)]].map(x=>`<div class="cell"><div class="k">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('')}</div>`}
   <div class="dsec">Competitive position — Text ELO (Arena)</div>

const ROUTEW={price:40,performance:30,capabilities:20,security:10};
const ROUTEMODELS=[

 {m:'gpt-5.5',price:55,performance:92,capabilities:93,security:80},
 {m:'claude-sonnet-4-6',price:70,performance:88,capabilities:90,security:90},
 {m:'gemini-3.1-flash',price:90,performance:80,capabilities:82,security:78},
 {m:'claude-haiku-4-5',price:95,performance:74,capabilities:70,security:88}];
function routeScore(x,w){const t=(w.price+w.performance+w.capabilities+w.security)||1;
  return (x.price*w.price+x.performance*w.performance+x.capabilities*w.capabilities+x.security*w.security)/t;}
function pageRouting(){
  const ranked=ROUTEMODELS.map(x=>({...x,s:routeScore(x,ROUTEW)})).sort((a,b)=>b.s-a.s);

      <span class="muted" style="font-size:12px">Mode: <strong>Weighted auto-route</strong></span></div>
     <div style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12.5px"><strong>Health-scored failover</strong>${sw(true,`toast('Failover toggled')`)}<span class="muted">Unhealthy or throttled providers drop in rank automatically.</span></div>

/* The Advisory button was a STUB: it un-hid a panel rendering a hardcoded
   `ADVICE` constant -- always Claude Haiku 4.5, always "HIGH" confidence, always
   the same $1,500-$2,200/mo HIPAA answer -- no matter what the user typed, and
   the textarea was pre-filled with a matching brief so it looked like it had
   read the input. The page claimed the reasoning was "on the record"; it was a
   string literal. Now it calls the real advisor, which reasons over the live
   catalog and mints a rated TDR. An empty result is shown as an error, never as
   a confident recommendation. */
/* Populate the advisor dropdown. Default order (Chairman): the model this
   account used most recently, else Anthropic Fable 5. If the preferred default
   is not routable we SAY SO rather than quietly selecting something else --
   the operator should know which model is about to spend their money. */
async function loadAdvisors(){
  const sel=$('#adv-m'), hint=$('#adv-mhint');
  try{
    const r=await api('/advise/options');
    if(!r.ok||!r.data){sel.innerHTML='<option value="">Unavailable</option>';return}
    const d=r.data, ms=d.models||[];
    /* The list is scoped to vendors THIS account holds a live key for, so an
       empty list is a real state with a real cause -- say so instead of
       rendering an empty control that looks broken. */
    if(!d.has_vendor_keys){
      sel.innerHTML='<option value="">No connectors yet</option>';
      sel.disabled=true;
      hint.innerHTML='Add a <a href="/keys.html">Connector</a> first — the advisor runs on a vendor you hold a key for.';
      const go=$('#adv-go'); if(go) go.disabled=true;
      return;
    }
    sel.disabled=false; const go=$('#adv-go'); if(go) go.disabled=false;
    sel.innerHTML=ms.map(m=>`<option value="${m.model_id}">${m.model_id} — ${m.provider||''}</option>`).join('')
      || '<option value="">No models available</option>';
    if(d.default) sel.value=d.default;
    const vend=(d.vendors||[]).join(', ');
    if(d.remembered&&d.remembered===d.default){
      hint.textContent=`Your last advisor. Showing models from your vendors: ${vend}.`;
    }else if(!d.default_available&&d.fallback){
      hint.textContent=`${d.fallback} is not among your vendors (${vend}), so the first available model is selected.`;
    }else{
      hint.textContent=`Defaulting to ${d.fallback}. Showing models from your vendors: ${vend}.`;
    }
  }catch(e){ sel.innerHTML='<option value="">Unavailable</option>'; }
}

async function doAdvise(){
  const brief=($('#adv-t').value||'').trim();
  const btn=$('#adv-go'), err=$('#adv-err'), out=$('#adv-out');
  err.style.display='none'; out.innerHTML='';
  if(!brief){err.textContent='Describe your use case first.';err.style.display='';return}
  btn.disabled=true; btn.textContent='Analysing the catalog…';
  try{
    const r=await api('/advise',{method:'POST',body:{brief,model:($('#adv-m')||{}).value||''}});
    if(!r.ok||!r.data||r.data.error){
      err.textContent=(r.data&&(r.data.error||r.data.detail))||'The advisor is unavailable right now. Nothing was charged.';
      err.style.display=''; return;
    }
    out.innerHTML=renderAdvice(r.data, ($('#adv-m')||{}).value||'');
  }catch(e){
    err.textContent='The advisor is unavailable right now. Nothing was charged.';
    err.style.display='';
  }finally{
    btn.disabled=false; btn.textContent='Get recommendation';
  }
}

     <div class="card"><div class="cbody"><div class="kicker">Expected performance</div>
      <p class="muted" style="font-size:12.5px;margin-top:8px">${esc(p.expected_performance||'—')}</p></div></div>
    </div>
    <div class="card" style="margin-top:14px"><div class="chead"><h3>Rationale</h3></div>
     <div class="cbody" style="font-size:13.4px;line-height:1.65">${esc(p.rationale||'—')}</div></div>
    ${p.limitations||p.cautions?`<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px">
      <div class="card"><div class="chead"><h3>Limitations</h3></div><div class="cbody" style="font-size:13px;line-height:1.6">${esc(p.limitations||'—')}</div></div>
      <div class="card"><div class="chead"><h3>Cautions</h3></div><div class="cbody" style="font-size:13px;line-height:1.6">${esc(p.cautions||'—')}</div></div>
     </div>`:''}
    <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px">
     <div class="card"><div class="chead"><h3>Alternative</h3></div><div class="cbody" style="font-size:13px;line-height:1.6">
       <strong>${esc(alt.model||'—')}</strong><br>${esc(alt.rationale||'')}</div></div>
     <div class="card"><div class="chead"><h3 class="bad">Not recommended</h3></div><div class="cbody" style="font-size:13px;line-height:1.6">
       <strong>${esc(no.category||'—')}</strong><br>${esc(no.reason||'')}</div></div>

    ${assumptions?`<div class="card" style="margin-top:14px"><div class="chead"><h3>Assumptions the advisor made</h3></div>
      <div class="cbody"><ul style="font-size:13px;line-height:1.7;margin:0;padding-left:18px">${assumptions}</ul></div></div>`:''}`;
}

function openTDR(i){

  const rIn=t.prov==='Anthropic'?3.00:0.14, rCr=t.prov==='Anthropic'?0.30:0.01, rOut=t.prov==='Anthropic'?15.00:0.28;
  const rows=[['Read (non-cache)',t.tin,rIn],['Read (cached)',t.cin,rCr],['Written (non-cache)',t.tout,rOut],['Written (cached)',0,rCr]];
  const total=rows.reduce((a,r)=>a+r[1]/1e6*r[2],0);
  openDrawer(`<div style="display:flex;gap:8px"><span class="badge ${t.ok?'ok':'bad'}">${t.ok?'OK':'ERROR'}</span><span class="badge dim">${t.prov}</span></div>
   <div class="dh" style="margin-top:8px">TDR · <span class="mono" style="font-size:13px">${t.t.toISOString()}</span></div>
   <div class="dsec">Attribution</div>
   <div class="kv">${[['Client',t.client],['Subclient',t.sub],['App',t.app],['Model',t.model],['Latency',t.lat+'ms'],['Rate version','seed']].map(x=>`<div class="cell"><div class="k">${x[0]}</div><div class="v" style="font-size:12px">${x[1]}</div></div>`).join('')}</div>
   <div class="dsec">Prompt (post-wrap preview)</div>
   <div class="chip" style="display:block;white-space:pre-wrap;font-size:11px">${esc(t.prompt)}</div>
   <div class="dsec">Billable buckets — rated at the in-force tariff</div>
   <table class="tbl"><thead><tr><th>Bucket</th><th class="num">Tokens</th><th class="num">Rate /1M</th><th class="num">Charge</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r[0]}</td><td class="num mono">${r[1].toLocaleString()}</td><td class="num mono">${money(r[2])}</td><td class="num mono">${money(r[1]/1e6*r[2],6)}</td></tr>`).join('')}

   <p class="muted" style="font-size:11.5px;margin-top:10px">Stamped with rate version <span class="badge dim">seed</span> at execution. Immutable financial entry — corrections are new entries, never edits.</p>`);
}

/* ─────────────────────────  ANALYTICS  ─────────────────────────
   Every figure here is this account's own rated spend, read from the TDR
   ledger. The slices are chosen for what a Proxy of Record uniquely knows:
   anyone can draw a spend line, but only the record sitting in front of every
   call can say which DEPARTMENT spent it, on which KEY, under which model —
   and say it from its own ledger rather than from a vendor's invoice.

   The old page drew from DAILY and SUM, seeded constants, with an invented
   "11,792 requests" hardcoded into the summary. */

const AN = {days:30, data:null, loading:false, loaded:false, error:''};

function anSetDays(d){ AN.days=d; AN.loaded=false; AN.data=null; render(); loadAnalytics(true); }

async function loadAnalytics(force){
  if(!S.authed || S.demo) return;
  if(AN.loading) return;
  if(AN.loaded && !force) return;
  AN.loading=true; AN.loaded=true;
  const r=await api('/account/analytics?days='+AN.days);
  AN.loading=false;
  if(!r.ok || !r.data){ AN.error=(r.data&&r.data.error)||('HTTP '+r.status); AN.data=null; render(); return; }
  AN.error=''; AN.data=r.data; render();
}

/* A horizontal bar row. Shares the .bar/.bt/.bv classes the rest of the console
   already uses, so this looks like the product rather than like a new page. */
// The Front End Agent panel.
//
// It leads with NET, not compression. A compression figure on its own is how a
// feature like this flatters itself: 60% smaller prompts sounds decisive and
// says nothing, because the compressions are themselves a model call on every
// request. Saved-minus-spent is the only number that decides anything, and it
// is routinely negative for a cheap model compressing an already-short prompt.
//
// MEASURED and LIVE are shown apart, never averaged. Measured rows are shadow
// runs -- the compression was computed and paid for, the original prompt still
// went to the expensive model. Averaging the two produces a number describing
// neither, and destroys the baseline you would compare against.
function feaPanel(f){
  if(!f || !f.available) return '';
  if(!f.ran) return `
   <div class="card" style="margin-top:14px"><div class="cbody">
     <div style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)">Front End Agent</div>
     <div class="muted" style="font-size:13px;margin-top:6px">
       Configured, but it has not run on any request in this window. It skips prompts
       under 1,200 characters, tool-call turns and structured content &mdash; below that
       size the compression cannot save more than the call to make it costs.</div>
   </div></div>`;

  const side = (s, label, note) => {
    if(!s) return '';
    const good = s.net_usd_est > 0;
    return `
     <div style="flex:1 1 300px">
       <div style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)">${label}</div>
       <div style="font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.15;margin:4px 0 2px;color:${good?'var(--good)':'var(--warn,#d29922)'}">
         ${s.net_usd_est < 0 ? '-' + money(Math.abs(s.net_usd_est)) : '+' + money(s.net_usd_est)}</div>
       <div style="font-size:13px;color:var(--slate)">net, after paying ${money(s.fea_cost_usd)} to compress</div>
       <div class="bar" style="margin-top:8px"><span class="bl">Saved (est)</span>
         <span class="bt"><i style="width:${Math.min(100,Math.max(2,(s.saved_usd_est/Math.max(s.saved_usd_est,s.fea_cost_usd)*100)))}%;background:var(--good)"></i></span>
         <span class="bv">${money(s.saved_usd_est)}</span></div>
       <div class="bar"><span class="bl">Cost to compress</span>
         <span class="bt"><i style="width:${Math.min(100,Math.max(2,(s.fea_cost_usd/Math.max(s.saved_usd_est,s.fea_cost_usd)*100)))}%;background:var(--slate)"></i></span>
         <span class="bv">${money(s.fea_cost_usd)}</span></div>
       <div class="muted" style="font-size:11.5px;margin-top:8px">
         ${fmt(s.requests)} requests &middot; ${fmt(s.chars_in)} &rarr; ${fmt(s.chars_out)} chars
         (<strong>${s.compression_pct}% smaller</strong>) &middot; ~${fmt(s.tokens_saved_est)} tokens saved.
         ${note}</div>
     </div>`;
  };

  return `
   <div class="card" style="margin-top:14px">
    <div class="cbody">
     <div style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)">Front End Agent &mdash; is the compression paying?</div>
     <div style="display:flex;gap:26px;flex-wrap:wrap;margin-top:8px">
       ${side(f.measured, 'Measured (shadow)', 'The compression was computed and billed; the original prompt still went to the model. This is the baseline.')}
       ${side(f.live, 'Live (applied)', 'The compressed prompt is what the model actually received.')}
     </div>
     <div class="muted" style="font-size:11.5px;margin-top:10px">
       Savings are <strong>estimated</strong>, and the estimate is stated rather than hidden:
       characters removed are converted at this account&rsquo;s own measured
       ${(f.measured||f.live||{}).chars_per_token || '?'} characters per token, then priced at its own
       blended input rate. Estimated because the smaller request was never actually made &mdash;
       we do not bill what we did not run. The cost to compress is <strong>measured</strong>, not
       estimated: that call really happened, including on the runs whose output was discarded.
     </div>
    </div>
   </div>`;
}

function anBars(rows, total, fmtVal){
  if(!rows || !rows.length) return '<div class="muted" style="font-size:13px">Nothing in this window.</div>';
  const max = Math.max(...rows.map(r=>r.cost_usd), 0.0000001);
  return rows.map(r=>{
    const pct = Math.max(1, r.cost_usd/max*100);
    const unattributed = /^unattributed$/i.test(r.name);
    return `<div class="bar" title="${esc(r.name)} · ${r.requests.toLocaleString()} requests">
      <span class="bl" style="${unattributed?'color:var(--warn)':''}">${esc(r.name)}</span>
      <span class="bt"><i style="width:${pct}%;${unattributed?'background:var(--warn)':''}"></i></span>
      <span class="bv">${fmtVal(r)}</span></div>`;
  }).join('');
}

function pageAnalytics(){
  const d=AN.data, t=(d&&d.totals)||null;
  const pick=(n)=>`<button class="btn sm ${AN.days===n?'':'ghost'}" onclick="anSetDays(${n})">${n}d</button>`;

  if(AN.error) return appShell('Analytics','Rated spend from your TDR ledger.',
    `<div class="card"><div class="cbody muted" style="font-size:13px">Could not load analytics
      (${esc(AN.error)}). Nothing is shown rather than figures that are not yours —
      <button class="btn sm ghost" onclick="loadAnalytics(true)">retry</button></div></div>`);
  if(!d) return appShell('Analytics','Rated spend from your TDR ledger.',
    `<div class="card"><div class="cbody muted" style="font-size:13px">Loading…</div></div>`);

  // The trend, drawn from the same series the dashboard uses.
  const peak=Math.max(...d.series.map(r=>r.cost_usd), 0);
  const bars=d.series.length
    ? d.series.map(r=>`<div class="dbar" title="${esc(r.date)} · ${money(r.cost_usd)} · ${r.requests} req${r.errors?' · '+r.errors+' refused':''}"
         style="height:${peak>0?Math.max(r.cost_usd>0?4:1, r.cost_usd/peak*100):1}%;background:${r.errors>0?'var(--warn)':'var(--indigo)'}"></div>`).join('')
    : '<div class="muted" style="align-self:center;width:100%;text-align:center;font-size:13px">No requests in this window.</div>';

  const unattributed=(d.by_department||[]).find(r=>/^unattributed$/i.test(r.name));
  const unattributedPct = unattributed && t.cost_usd ? (unattributed.cost_usd/t.cost_usd*100) : 0;

  return appShell('Analytics','Rated spend from your own TDR ledger — by department, model and key.', `
   <div class="statgrid">
    <div class="stat"><div class="l">Rated spend</div><div class="v">${money(t.cost_usd)}</div><div class="d muted">as billed, not estimated</div></div>
    <div class="stat"><div class="l">Requests</div><div class="v">${t.requests.toLocaleString()}</div><div class="d muted">${money(t.avg_cost_usd,5)} average</div></div>
    <div class="stat"><div class="l">Tokens in / out</div><div class="v" style="font-size:19px">${fmt(t.input_tokens)} / ${fmt(t.output_tokens)}</div><div class="d muted">every bucket rated</div></div>
    <div class="stat"><div class="l">Refused</div><div class="v">${t.refused.toLocaleString()}</div><div class="d ${t.refused?'warn':'muted'}">policy held, nothing spent</div></div>
   </div>

   ${d.counterfactual ? `
   <div class="card anhero" style="margin-top:14px">
    <div class="cbody" style="display:flex;gap:26px;align-items:center;flex-wrap:wrap">
     <div style="flex:1 1 320px">
      <div style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)">What the routing was worth</div>
      <div style="font-family:var(--mono);font-size:38px;font-weight:600;line-height:1.1;margin:6px 0 2px;color:var(--good)">${money(d.counterfactual.avoided_usd)}</div>
      <div style="font-size:13.5px;color:var(--slate)">not spent, on the same ${fmt(t.input_tokens + t.output_tokens)} tokens</div>
     </div>
     <div style="flex:1 1 300px">
      <div class="bar"><span class="bl">All on ${esc(d.counterfactual.model)}</span>
        <span class="bt"><i style="width:100%;background:var(--slate)"></i></span>
        <span class="bv">${money(d.counterfactual.would_have_cost_usd)}</span></div>
      <div class="bar"><span class="bl">What you paid</span>
        <span class="bt"><i style="width:${Math.max(2,(d.counterfactual.paid_usd/d.counterfactual.would_have_cost_usd*100))}%;background:var(--good)"></i></span>
        <span class="bv">${money(d.counterfactual.paid_usd)}</span></div>
      <div class="muted" style="font-size:11.5px;margin-top:8px">
        A counterfactual, priced from the same published tariff that rated the real
        calls. It does not claim the work would have been done on that model &mdash;
        it answers what the routing is worth, using the two things only the proxy
        holds: every call's real token counts, and the rate in force when it ran.
        <strong>${d.counterfactual.avoided_pct}% below the ceiling.</strong></div>
     </div>
    </div>
   </div>` : ''}

   ${feaPanel(d.fea)}

   <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px">
    <div class="card"><div class="cbody">
      <div style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)">Effective blended rate</div>
      <div style="font-family:var(--mono);font-size:26px;font-weight:600;margin-top:4px">$${d.blended_per_1m_usd}<span style="font-size:13px;color:var(--faint)"> / 1M tokens</span></div>
      <div class="muted" style="font-size:12px;margin-top:4px">Across every vendor and model. The one number that stays comparable when the traffic mix changes underneath.</div>
    </div></div>
    <div class="card"><div class="cbody">
      <div style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)">Spend concentration</div>
      <div style="font-family:var(--mono);font-size:26px;font-weight:600;margin-top:4px">${d.concentration.top_key_pct}%<span style="font-size:13px;color:var(--faint)"> on one key</span></div>
      <div class="muted" style="font-size:12px;margin-top:4px">

   <div class="card" style="margin-top:14px">
    <div class="chead"><h3>Daily spend</h3>

   </div>

   <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px">

     <div class="cbody">${anBars(d.by_department, t.cost_usd, r=>money(r.cost_usd))}

   </div>

   <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px">
    <div class="card"><div class="chead"><h3>Spend by model</h3></div>
     <div class="cbody">${anBars(d.by_model, t.cost_usd, r=>money(r.cost_usd))}</div></div>
    <div class="card"><div class="chead"><h3>Spend by vendor</h3></div>
     <div class="cbody">${anBars(d.by_provider, t.cost_usd, r=>money(r.cost_usd))}

    <div class="cbody">${anBars(d.by_app, t.cost_usd, r=>money(r.cost_usd))}</div></div>`);

  const rows=LIMITS.map(l=>{const pct=Math.min(100,l.burn/l.limit*100);
   return `<tr><td><span class="mono" style="font-size:12px">${l.node}</span></td><td><span class="badge ${l.type==='Hard'?'bad':'warn'}">${l.type}</span></td>

   <td style="font-size:12px">${l.mode}</td>
   <td><span class="badge ${l.status==='ok'?'ok':l.status}">${l.status==='ok'?'OK':l.status==='warn'?'80% ALERT':'AT LIMIT'}</span></td>

  return appShell('Spend limits','Hard limits deny at threshold in the hot path. Soft limits alert. Both inherit down the tree and reset monthly.',
  `<div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>Node</th><th>Type</th><th class="num">Limit</th><th>Burn (MTD)</th><th>Enforcement</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>

/* =====================  ORGANIZATION  =====================
   Defining the organization IS defining the governance. Every form below
   simultaneously sets an object's definition and its spend controls; the
   spend column on each row is the live TDR total for that object, joined
   from the ledger by value (department/project/key), never invented. */
const ORG={departments:[],participants:[],teams:[],projects:[],boards:[],seats:[],
           team_members:[],project_members:[],unattributed:[],coverage:[],ledger_total:null,loaded:false,err:''};

                ['boards','Boards & seats'],['projects','Projects'],['unattributed','Unattributed']];

// Client-side mirror of the API's object specs. Adding a governance field is a
// one-line change here and one in org_api.SPECS — no new endpoint.
const ORG_FORMS={
 departments:{pk:'slug',title:'Department',fields:[
   ['slug','Slug','text','cost-centre key, e.g. sysadmin — must match the key-bound department'],
   ['name','Name','text',''],['description','Description','textarea',''],
   ['budget_usd','Budget (USD)','number','period budget this cost centre rolls up to'],
   ['cap_usd','Cap (USD)','number','hard ceiling'],
   ['budget_period','Budget period','text','monthly / quarterly'],
   ['responsible_participant_id','Responsible human','participant-human','the head who owns this spend'],
   ['status','Status','status','']]},
 participants:{pk:'slug',title:'Player',fields:[
   ['slug','Slug','text',''],['name','Name','text',''],
   ['kind','Kind','kind','human = employee (carries authority); agent = contractor (engaged, not hired)'],
   ['role','Role','text',''],['department_slug','Department','department',''],
   ['email','Email','text','humans'],
   ['user_email_slug','Ledger user slug','text','exactly as it lands in requests.usr, e.g. me-jerrywlambert.com'],
   ['key_id','Bound key','text','cpk_… — carries user + department, so every session is attributed by construction'],
   ['model','Model','text','agents'],['eprompt','Definition prompt (SOW)','textarea','agents — the prompt IS the statement of work'],
   ['cap_usd','Cap (USD)','number','the purchase order'],['budget_usd','Budget (USD)','number',''],
   ['may_authorize_spend','May authorize spend','bool','humans only'],
   ['may_engage_agents','May engage agents','bool','humans only — engaging an agent is an act of authority'],
   ['status','Status','status','']]},
 teams:{pk:'slug',title:'Team',fields:[
   ['slug','Slug','text',''],['name','Name','text',''],
   ['objective','Objective (team prompt)','textarea',''],
   ['department_slug','Department','department',''],['folder','Folder','text',''],
   ['budget_usd','Budget (USD)','number',''],['cap_usd','Cap (USD)','number',''],
   ['lead_participant_id','Lead','participant',''],['status','Status','status','']]},
 projects:{pk:'slug',title:'Project',fields:[
